<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="est-ui-size" content="560x300">
<title>Spectrum tilt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top">
  <h1>Spectrum</h1>
  <p class="readout" id="readout" aria-live="polite">Waiting for the host…</p>
</div>
<canvas id="spectrum" width="528" height="170" role="img" aria-label="The plugin's output spectrum from 20 Hz to half the sample rate, with the tilt's curve over it"></canvas>
<div class="knobs">
  <est-knob param="0" label="Tilt" unit="dB"></est-knob>
  <est-knob param="1" label="Pivot" unit="Hz"></est-knob>
  <est-knob param="2" label="Output" unit="dB"></est-knob>
</div>
<script src="est-ui.js"></script>
<script src="ui.js"></script>
</body>
</html>
