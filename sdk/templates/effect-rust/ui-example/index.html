<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- `est new --ui` sizes the frame from this (est.json's ui.size); Cyber draws the frame at exactly
     that size in CSS pixels and never scales it. -->
<meta name="est-ui-size" content="440x180">
<title>EST Effect Template</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>EST Effect Template</h1>
<div class="groups">
  <fieldset>
    <legend>Output</legend>
    <div class="knobs">
      <est-knob param="0" label="Gain" unit="dB"></est-knob>
    </div>
  </fieldset>
  <fieldset>
    <legend>Filter</legend>
    <div class="knobs">
      <est-knob param="1" label="Cutoff" unit="Hz" scale="log"></est-knob>
      <est-knob param="2" label="Resonance"></est-knob>
      <est-knob param="3" label="Mode" labels="Low-pass, Band-pass, High-pass, Notch"></est-knob>
    </div>
  </fieldset>
</div>
<script src="est-ui.js"></script>
<script src="ui.js"></script>
</body>
</html>
